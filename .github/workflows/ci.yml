# Every pull request and push to main: the APK built with chat's main branch (chat-core's
# chat-json, compiled with the NDK for each ABI), Android's lint on it, and the debug APK kept.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # chat's main moves on without this repository: once a day it's built with it anyway.
    - cron: "53 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: chat-apk
    steps:
      # Side by side, as gradle.properties' chat.source (../chat) has them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: chat-apk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chat-labs/chat
          path: chat
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      # Checks the Gradle wrapper against Gradle's own checksums, and caches what Gradle fetches.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: The SDK and NDK app/build.gradle.kts builds with
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" > /dev/null
      - name: The Rust chat's rust-toolchain.toml names
        working-directory: chat
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: chat -> target
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just@1.58.0
      - run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-debug-apk
          path: chat-apk/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: lint-report
          path: chat-apk/app/build/reports/
          retention-days: 14
